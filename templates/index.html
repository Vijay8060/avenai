<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aven AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body oncontextmenu="return false">
<div class="sidebar">
<h2>Aven AI</h2>
<button class="new-chat" onclick="newChat()">+ New Chat</button>
</div>
<div class="main">
<div class="topbar">
<h1>Aven AI</h1>
<p>Your Personal AI Assistant</p>
</div>
<div id="chatbox"></div>
<div id="voice-status">🎤 Click microphone and speak...</div>
<div class="input-area">
<input id="message" type="text" placeholder="Message Aven AI..." autocomplete="off">
<button onclick="voiceInput()">🎤</button>
<button onclick="send()">➜</button>
</div>
</div>
<script>
window.onload=async()=>{await newChat();document.getElementById("message").focus();}
document.getElementById("message").addEventListener("keypress",e=>{if(e.key==="Enter")send();});
async function newChat(){await fetch("/new_chat");document.getElementById("chatbox").innerHTML="";}
function escapeHTML(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
async function send(){
const input=document.getElementById("message");
const text=input.value.trim();
if(!text)return;
const chat=document.getElementById("chatbox");
chat.innerHTML+=`<div class="user">${escapeHTML(text)}</div><div class="bot loading" id="loading">Aven is thinking...</div>`;
input.value="";
chat.scrollTop=chat.scrollHeight;
try{
const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
const d=await r.json();
document.getElementById("loading").remove();
chat.innerHTML+=`<div class="bot">${escapeHTML(d.reply)}</div>`;
}catch(e){document.getElementById("loading").innerText="❌ Connection error";}
chat.scrollTop=chat.scrollHeight;
}
function voiceInput(){
if(!("webkitSpeechRecognition" in window)){alert("Use Google Chrome");return;}
const rec=new webkitSpeechRecognition();
const status=document.getElementById("voice-status");
rec.lang="en-US";
rec.onstart=()=>{status.style.display="block";status.classList.add("listening");status.innerText="🔴 Aven is listening...";}
rec.onresult=e=>{document.getElementById("message").value=e.results[0][0].transcript;status.innerText="✅ Voice captured";}
rec.onend=()=>{setTimeout(()=>{status.style.display="none";status.classList.remove("listening");},1500);}
rec.onerror=e=>{status.style.display="block";status.innerText="❌ "+e.error;}
rec.start();
}
</script>
</body>
</html>
