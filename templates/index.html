<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aven AI</title>

<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

<div class="sidebar">
    <h2>Aven AI</h2>
    <button class="new-chat" onclick="newChat()">+ New Chat</button>
</div>

<div class="main">

    <div class="topbar">
        <h1>Aven AI</h1>
        <p>Your Personal AI Assistant</p>
    </div>

    <div id="chatbox"></div>

    <div id="voice-status">
        🎤 Click microphone and speak...
    </div>

    <div class="input-area">
        <input id="message" type="text" placeholder="Message Aven AI..." autocomplete="off">
        <button onclick="voiceInput()">🎤</button>
        <button onclick="send()">➜</button>
    </div>

</div>

<script>

window.onload = async () => {
    await newChat();
    document.getElementById("message").focus();
};

document.getElementById("message").addEventListener("keypress", function(e){
    if(e.key==="Enter"){
        send();
    }
});

async function newChat(){
    await fetch("/new_chat");
    document.getElementById("chatbox").innerHTML="";
}

function escapeHTML(text){
    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

async function send(){

    const input=document.getElementById("message");
    const text=input.value.trim();

    if(!text) return;

    const chat=document.getElementById("chatbox");

    chat.innerHTML += `
        <div class="user">${escapeHTML(text)}</div>
        <div class="bot loading" id="loading">
            Aven is thinking...
        </div>
    `;

    input.value="";
    chat.scrollTop=chat.scrollHeight;

    try{

        const response = await fetch("/chat",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:text
            })
        });

        const data = await response.json();

        document.getElementById("loading").remove();

        chat.innerHTML += `
            <div class="bot">${escapeHTML(data.reply)}</div>
        `;

    }catch(err){

        document.getElementById("loading").innerText="❌ Connection Error";

    }

    chat.scrollTop=chat.scrollHeight;

}


// ==========================
// Voice Assistant
// ==========================

function voiceInput(){

    if(!("webkitSpeechRecognition" in window)){
        alert("Please use Google Chrome.");
        return;
    }

    const recognition = new webkitSpeechRecognition();

    recognition.lang="en-US";
    recognition.continuous=false;
    recognition.interimResults=false;

    const status=document.getElementById("voice-status");

    recognition.onstart=function(){

        status.style.display="block";
        status.classList.add("listening");
        status.innerHTML="🔴 Aven is listening...";

    };

    recognition.onresult=function(event){

        const text=event.results[0][0].transcript.toLowerCase();

        status.innerHTML="✅ "+text;
const websites = {
    youtube: "https://www.youtube.com",
    google: "https://www.google.com",
    gmail: "https://mail.google.com",
    chatgpt: "https://chatgpt.com",
    github: "https://github.com",
    instagram: "https://www.instagram.com",
    facebook: "https://www.facebook.com",
    x: "https://x.com",
    twitter: "https://x.com",
    amazon: "https://www.amazon.in",
    flipkart: "https://www.flipkart.com",
    netflix: "https://www.netflix.com",
    linkedin: "https://www.linkedin.com",
    spotify: "https://open.spotify.com",
    reddit: "https://www.reddit.com",
    wikipedia: "https://www.wikipedia.org",
    irctc: "https://www.irctc.co.in"
};

if (text.startsWith("open ")) {

    let site = text.replace("open ", "").trim().toLowerCase();

    // Open known websites
    if (websites[site]) {
        window.open(websites[site], "_blank");
        return;
    }

    // User already spoke a domain
    if (
        site.endsWith(".com") ||
        site.endsWith(".in") ||
        site.endsWith(".org") ||
        site.endsWith(".net") ||
        site.endsWith(".co.in")
    ) {
        window.open("https://www." + site, "_blank");
        return;
    }

    // Default to .com
    window.open("https://www." + site + ".com", "_blank");
    return;
}

        document.getElementById("message").value=text;

        send();

    };

    recognition.onerror=function(event){

        status.style.display="block";
        status.innerHTML="❌ "+event.error;

    };

    recognition.onend=function(){

        setTimeout(function(){

            status.style.display="none";
            status.classList.remove("listening");

        },1500);

    };

    recognition.start();

}

</script>

</body>
</html>
